name: Weibo Cookie Health

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic used for the read-only check
        required: false
        default: "#微博热搜#"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: weibo-data-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Check PC and mobile sessions
        id: health
        continue-on-error: true
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          WEIBO_MOBILE_COOKIE: ${{ secrets.WEIBO_MOBILE_COOKIE }}
          TEST_TOPIC: ${{ inputs.topic || '#微博热搜#' }}
        run: python -m weibo_hot_hub.health_cli --topic "$TEST_TOPIC"
      - name: Refresh README status and today's hotlist
        if: always()
        run: python -m weibo_hot_hub.readme_cli
      - name: Commit Cookie health state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/state/cookies.json README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state/cookies.json README.md
            git commit -m "state: update Cookie health"
            git pull --rebase origin main
            git push
          fi
      - name: Fail when a session is invalid
        if: steps.health.outcome != 'success'
        run: exit 1
