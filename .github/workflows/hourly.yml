name: Hourly Archive

on:
  workflow_dispatch:
    inputs:
      pages:
        description: Pages per topic (1-10)
        required: false
        default: "1"
      max_topics:
        description: Maximum topics; 0 means the full hotlist
        required: false
        default: "0"
      force:
        description: Archive again even if the current-hour snapshot exists
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weibo-data-writer
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check whether this hour is already archived
        id: archive-check
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          snapshot="data/hotlists/$(TZ=Asia/Shanghai date +'%Y/%m/%d/%H.json')"
          run_record="data/runs/$(TZ=Asia/Shanghai date +'%Y/%m/%d/%H.json')"
          if [ "$FORCE" != "true" ] && [ -f "$snapshot" ] && [ -f "$run_record" ]; then
            echo "Current hour is already complete: $snapshot"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Current hour needs an archive"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.archive-check.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.archive-check.outputs.should_run == 'true'
        run: pip install .
      - name: Archive hourly hotlist, metrics, posts, and AI answers
        if: steps.archive-check.outputs.should_run == 'true'
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          WEIBO_MOBILE_COOKIE: ${{ secrets.WEIBO_MOBILE_COOKIE }}
          PAGES: ${{ inputs.pages || '1' }}
          MAX_TOPICS: ${{ inputs.max_topics || '0' }}
        run: |
          if ! [[ "$PAGES" =~ ^([1-9]|10)$ ]]; then
            echo "pages must be between 1 and 10"
            exit 2
          fi
          if ! [[ "$MAX_TOPICS" =~ ^[0-9]+$ ]]; then
            echo "max_topics must be a non-negative integer"
            exit 2
          fi
          python -m weibo_hot_hub.hourly --pages "$PAGES" --max-topics "$MAX_TOPICS"
          python -m weibo_hot_hub.readme_cli
      - name: Commit changed data
        if: steps.archive-check.outputs.should_run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- data README.md)" ]; then
            echo "No hourly data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git commit -m "data: hourly archive"
          git fetch origin main
          snapshot="data/hotlists/$(TZ=Asia/Shanghai date +'%Y/%m/%d/%H.json')"
          run_record="data/runs/$(TZ=Asia/Shanghai date +'%Y/%m/%d/%H.json')"
          if git cat-file -e "origin/main:$snapshot" 2>/dev/null \
            && git cat-file -e "origin/main:$run_record" 2>/dev/null; then
            echo "Remote hour completed while this run was collecting; discarding cloud result"
            exit 0
          fi
          git rebase origin/main
          git fetch origin main
          if git cat-file -e "origin/main:$snapshot" 2>/dev/null \
            && git cat-file -e "origin/main:$run_record" 2>/dev/null; then
            echo "Remote hour completed before push; discarding cloud result"
            exit 0
          fi
          git push
