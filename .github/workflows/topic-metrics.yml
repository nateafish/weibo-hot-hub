name: Topic Metrics

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic including both # characters
        required: true

permissions:
  contents: write

concurrency:
  group: weibo-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Collect public topic metrics
        run: python -m weibo_hot_hub.topic_cli '${{ inputs.topic }}'
      - name: Commit changed data
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update topic metrics"
          git push

