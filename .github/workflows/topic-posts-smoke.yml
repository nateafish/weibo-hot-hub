name: Topic Posts Smoke Test

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic including both # characters
        required: true
      pages:
        description: Pages to collect (1-10)
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Collect a read-only sample
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python -m weibo_hot_hub.cli '${{ inputs.topic }}' --pages '${{ inputs.pages }}'

