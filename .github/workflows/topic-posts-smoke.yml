name: Topic Posts Smoke Test

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic including both # characters
        required: true
      pages:
        description: Pages to collect (1-10)
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: weibo-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Collect and archive topic posts
        env:
          WEIBO_MOBILE_COOKIE: ${{ secrets.WEIBO_MOBILE_COOKIE }}
          TOPIC: ${{ inputs.topic }}
          PAGES: ${{ inputs.pages }}
        run: |
          if ! [[ "$PAGES" =~ ^([1-9]|10)$ ]]; then
            echo "pages must be between 1 and 10"
            exit 2
          fi
          python -m weibo_hot_hub.posts_cli "$TOPIC" --pages "$PAGES"
      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No post data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update topic posts"
          git push
