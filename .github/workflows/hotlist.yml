name: Hotlist

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weibo-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Collect upstream-compatible hotlist
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python -m weibo_hot_hub.hotlist_cli
      - name: Commit changed data
        run: |
          if git diff --quiet -- data; then
            echo "No hotlist change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update hotlist"
          git push

