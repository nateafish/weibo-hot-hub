name: Hourly Archive Watchdog

on:
  schedule:
    - cron: "27,42,57 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  statuses: read

concurrency:
  group: weibo-hourly-watchdog
  cancel-in-progress: true

jobs:
  ensure-current-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a missing hourly archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          suffix="$(TZ=Asia/Shanghai date +'%Y/%m/%d/%H.json')"
          hotlist="data/hotlists/$suffix"
          run_record="data/runs/$suffix"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$hotlist?ref=$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh api "repos/$GITHUB_REPOSITORY/contents/$run_record?ref=$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Current hour is already complete: $hotlist"
            exit 0
          fi

          lease_context="local-collector/$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H')+08:00"
          lease_status="$(
            for sha in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_REF_NAME&per_page=10" --jq '.[].sha'); do
              gh api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses" \
                --jq ".[] | select(.context == \"$lease_context\") | [.updated_at, .state] | @tsv"
            done | sort | tail -1
          )"
          if [ -n "$lease_status" ]; then
            lease_updated="$(printf '%s' "$lease_status" | cut -f1)"
            lease_state="$(printf '%s' "$lease_status" | cut -f2)"
            lease_age="$(( $(date +%s) - $(date -d "$lease_updated" +%s) ))"
            if [ "$lease_state" = pending ] && [ "$lease_age" -ge 0 ] && [ "$lease_age" -le 900 ]; then
              echo "Fresh local collector lease found (${lease_age}s old); skipping fallback"
              exit 0
            fi
            echo "Local lease is $lease_state or stale (${lease_age}s); fallback is allowed"
          else
            echo "No local collector lease; fallback is allowed"
          fi

          active_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/hourly.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$active_runs" -gt 0 ]; then
            echo "Hourly Archive is already queued or running"
            exit 0
          fi

          echo "Current hour is missing; dispatching Hourly Archive"
          gh workflow run hourly.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f pages=1 \
            -f max_topics=0
