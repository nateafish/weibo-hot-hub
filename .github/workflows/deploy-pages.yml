name: Deploy Static Frontend

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "frontend/**"
      - "src/weibo_hot_hub/site_export.py"
      - "pyproject.toml"
      - "scripts/build-static-frontend"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Build browser data packages
        run: >-
          python -m weibo_hot_hub.site_export
          --data-root data
          --output frontend/public/site-data
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Validate frontend
        run: |
          pnpm --dir frontend test
          pnpm --dir frontend typecheck
      - name: Build static Pages artifact
        run: bash scripts/build-static-frontend
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        with:
          path: frontend/out
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId || '')) throw new Error('Missing Pages artifact ID');
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const { owner, repo } = context.repo;
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: Number(artifactId), pages_build_version: context.sha, oidc_token: idToken
            });
            const deploymentId = String(deployment.id || deployment.status_url?.split('/').pop() || context.sha);
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 10000));
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner, repo, deployment_id: deploymentId
              });
              if (data.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                throw new Error(`Pages publication failed: ${data.status}`);
              }
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              owner, repo, deployment_id: deploymentId
            });
            throw new Error('Pages publication exceeded ten minutes');
