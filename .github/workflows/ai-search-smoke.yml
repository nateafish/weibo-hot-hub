name: AI Search Smoke Test

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: Stable topic id
        required: true
      topic:
        description: Topic including both # characters
        required: true

permissions:
  contents: write

concurrency:
  group: weibo-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Collect AI answer only when changed
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          TOPIC_ID: ${{ inputs.topic_id }}
          TOPIC: ${{ inputs.topic }}
        run: python -m weibo_hot_hub.ai_cli "$TOPIC_ID" "$TOPIC"
      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No AI answer change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update AI search answer"
          git push
