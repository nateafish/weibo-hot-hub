[project]
name = "weibo-hot-hub"
version = "0.1.0"
description = "Hourly, deduplicated archives for Weibo hot topics"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
